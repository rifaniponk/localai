name: ci-cd
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.d.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        run: |
          BASE="${{ github.event.before }}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then BASE=""; fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=""; fi
          SLUGS=$(node scripts/ci-detect.mjs "$BASE")
          REMOVED=$(node scripts/ci-removed.mjs "$BASE")
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "removed=$REMOVED" >> "$GITHUB_OUTPUT"
          echo "apps yang berubah: $SLUGS | dihapus: $REMOVED"

  build:
    needs: detect
    if: needs.detect.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.detect.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: cfg
        run: |
          node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync(process.argv[1]+"/app.json","utf8"));
            const dist=m.dist||".";
            const path=dist==="."?process.argv[1]:(process.argv[1]+"/"+dist);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,"build="+(m.build||"")+"\ndist="+dist+"\npath="+path+"\n");
          ' "apps/${{ matrix.slug }}"
      - name: Build app
        if: steps.cfg.outputs.build != ''
        working-directory: apps/${{ matrix.slug }}
        env:
          BUILD: ${{ steps.cfg.outputs.build }}
        run: bash -c "$BUILD"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.slug }}
          path: ${{ steps.cfg.outputs.path }}
          if-no-files-found: error

  deploy:
    needs: [detect, build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.page.outputs.page_url }}
    steps:
      - id: page
        uses: actions/configure-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Landing + manifest
        run: |
          mkdir -p site
          cp -r landing/. site/
          if [ -f CNAME ]; then cp CNAME site/CNAME; else rm -f site/CNAME; fi
          node scripts/build-manifest.mjs site/manifest.json
      - uses: actions/download-artifact@v4
        if: needs.detect.outputs.slugs != '[]'
        with:
          pattern: app-*
          path: artifacts
      - name: Assemble full site (artifacts + repo)
        run: |
          shopt -s nullglob
          for slug in $(node -e 'process.stdout.write(process.argv[1].replace(/[\[\]"]/g,"")+"\n")' '${{ needs.detect.outputs.removed }}'); do
            echo "✘ $slug dihapus dari repo — tidak ikut di-assemble"
          done
          for appdir in apps/*/; do
            slug="$(basename "$appdir")"
            [ -f "$appdir/app.json" ] || continue
            dist=$(node -e 'const m=require("./"+process.argv[1]);process.stdout.write(m.dist||".")' "$appdir/app.json")
            build=$(node -e 'const m=require("./"+process.argv[1]);process.stdout.write(m.build||"")' "$appdir/app.json")
            if [ -d "artifacts/app-$slug" ]; then
              src="artifacts/app-$slug"
              [ "$dist" != "." ] && src="$src/$dist"
            elif [ -n "$build" ]; then
              # app with build step but unchanged in this push: build inline
              (cd "$appdir" && bash -c "$build")
              src="$appdir$dist"; [ "$dist" = "." ] && src="$appdir"
            else
              src="$appdir"
            fi
            mkdir -p "site/$slug"
            cp -r "$src/." "site/$slug/"
            echo "✔ site/$slug"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
