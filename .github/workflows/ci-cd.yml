name: ci-cd
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.d.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        run: |
          BASE="${{ github.event.before }}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then BASE=""; fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=""; fi
          SLUGS=$(node scripts/ci-detect.mjs "$BASE")
          REMOVED=$(node scripts/ci-removed.mjs "$BASE")
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "removed=$REMOVED" >> "$GITHUB_OUTPUT"
          echo "apps yang berubah: $SLUGS | dihapus: $REMOVED"

  build:
    needs: detect
    if: needs.detect.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.detect.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: cfg
        run: |
          node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync(process.argv[1]+"/app.json","utf8"));
            const dist=m.dist||".";
            const path=dist==="."?process.argv[1]:(process.argv[1]+"/"+dist);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,"build="+(m.build||"")+"\ndist="+dist+"\npath="+path+"\n");
          ' "apps/${{ matrix.slug }}"
      - name: Build app
        if: steps.cfg.outputs.build != ''
        working-directory: apps/${{ matrix.slug }}
        env:
          BUILD: ${{ steps.cfg.outputs.build }}
        run: bash -c "$BUILD"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.slug }}
          path: ${{ steps.cfg.outputs.path }}
          if-no-files-found: error

  deploy:
    needs: [detect, build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.page.outputs.page_url }}
    steps:
      - id: page
        uses: actions/configure-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch previous gh-pages
        id: prev
        run: |
          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add ../prev origin/gh-pages
            rm -rf ../prev/.git
            cp -r ../prev/. site/
            echo "has_prev=true" >> "$GITHUB_OUTPUT"
          else
            mkdir -p site
          fi
      - name: Landing + manifest
        run: |
          cp -r landing/. site/
          if [ -f CNAME ]; then cp CNAME site/CNAME; else rm -f site/CNAME; fi
          node scripts/build-manifest.mjs site/manifest.json
      - uses: actions/download-artifact@v4
        if: needs.detect.outputs.slugs != '[]'
        with:
          pattern: app-*
          path: artifacts
      - name: Merge built apps into site
        run: |
          shopt -s nullglob
          for slug in $(node -e 'process.stdout.write(process.argv[1].replace(/[\[\]"]/g,"")+"\n")' '${{ needs.detect.outputs.removed }}'); do
            rm -rf "site/$slug"
            echo "✘ site/$slug dihapus (app dihapus dari repo)"
          done
          for d in artifacts/app-*/; do
            slug="${d#artifacts/app-}"; slug="${slug%/}"
            rm -rf "site/$slug"
            mkdir -p "site/$slug"
            cp -r "$d." "site/$slug/"
            echo "✔ site/$slug diperbarui"
          done
          # prune: any site folder that is neither a current app nor landing file
          node -e '
            const fs=require("fs");
            const apps=fs.readdirSync("apps").filter(s=>fs.existsSync(`apps/${s}/app.json`));
            const landing=fs.readdirSync("landing");
            for (const d of fs.readdirSync("site")) {
              if (fs.statSync(`site/${d}`).isDirectory() && !apps.includes(d)) {
                fs.rmSync(`site/${d}`,{recursive:true});
                console.log("✘ site/"+d+" dihapus (bukan app aktif)");
              }
            }
          '
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
