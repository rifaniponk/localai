<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>localai — AI-Generated Apps Showcase</title>
  <style>
    :root {
      --bg: #0b0e14; --card: #141926; --border: #232b3d;
      --fg: #e6e9f0; --muted: #8b94a7; --accent: #6ea8fe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
    }
    header {
      padding: 3rem 1.5rem 2rem; max-width: 1080px; margin: 0 auto;
    }
    h1 { margin: 0 0 .5rem; font-size: 2rem; }
    h1 span { color: var(--accent); }
    .sub { color: var(--muted); max-width: 60ch; }
    main { max-width: 1080px; margin: 0 auto; padding: 0 1.5rem 4rem; }
    .grid {
      display: grid; gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.25rem; text-decoration: none;
      color: inherit; display: flex; flex-direction: column; gap: .5rem;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h2 { margin: 0; font-size: 1.1rem; }
    .card p { margin: 0; color: var(--muted); font-size: .9rem; flex: 1; }
    .meta { display: flex; gap: .5rem; align-items: center; font-size: .75rem; }
    .tag {
      background: #1c2436; border: 1px solid var(--border);
      padding: .15rem .5rem; border-radius: 999px; color: var(--muted);
    }
    .draft { opacity: .55; }
    .badge { color: #f0a840; }
    .empty { color: var(--muted); }
    footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 2rem; }
  </style>
</head>
<body>
  <header>
    <h1>local<span>ai</span>.ponkcoding.com</h1>
    <p class="sub">Katalog web app yang di-generate oleh local AI agent (Hermes + Qwen lokal).
      Semua app di-build otomatis via GitHub Actions — tiap app punya CI/CD sendiri.</p>
  </header>
  <main>
    <div class="grid" id="grid"><p class="empty">Memuat manifest…</p></div>
  </main>
  <footer>generated apps by a local LLM · no cloud APIs were harmed</footer>
  <script>
    fetch("manifest.json", { cache: "no-store" })
      .then(r => r.json())
      .then(({ apps }) => {
        const grid = document.getElementById("grid");
        if (!apps.length) { grid.innerHTML = '<p class="empty">Belum ada app.</p>'; return; }
        grid.innerHTML = apps.map(a => `
          <a class="card ${a.status === "draft" ? "draft" : ""}" href="${a.path}">
            <h2>${a.name}</h2>
            <p>${a.description}</p>
            <div class="meta">
              <span class="tag">${a.stack}</span>
              ${a.status === "draft" ? '<span class="tag badge">draft</span>' : ""}
              <span class="tag">${a.created || ""}</span>
            </div>
          </a>`).join("");
      })
      .catch(() => {
        document.getElementById("grid").innerHTML =
          '<p class="empty">manifest.json tidak ditemukan.</p>';
      });
  </script>
</body>
</html>
